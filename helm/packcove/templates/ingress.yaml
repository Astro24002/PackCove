{{- if .Values.ingress.enabled }}
{{- if and .Values.ingress.tls (not .Values.ingress.hostname) }}
{{- fail "ingress.hostname is required when ingress.tls is enabled" }}
{{- end }}
{{- $annotations := mergeOverwrite (deepCopy .Values.commonAnnotations) .Values.ingress.annotations }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "packcove.fullname" . }}
  namespace: {{ include "packcove.namespace" . | quote }}
  labels:
    {{- include "packcove.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.ingressClassName }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
    {{- if .Values.ingress.hostname }}
    - host: {{ tpl .Values.ingress.hostname . | quote }}
      http:
        paths:
          {{- with .Values.ingress.extraPaths }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          - path: {{ .Values.ingress.path | quote }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "packcove.fullname" . }}
                port:
                  name: http
    {{- else if .Values.ingress.path }}
    - http:
        paths:
          {{- with .Values.ingress.extraPaths }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          - path: {{ .Values.ingress.path | quote }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "packcove.fullname" . }}
                port:
                  name: http
    {{- end }}
    {{- range .Values.ingress.extraHosts }}
    - host: {{ tpl .name $ | quote }}
      http:
        paths:
          - path: {{ default "/" .path | quote }}
            pathType: {{ default "Prefix" .pathType }}
            backend:
              service:
                name: {{ include "packcove.fullname" $ }}
                port:
                  name: http
    {{- end }}
    {{- with .Values.ingress.extraRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if or .Values.ingress.tls .Values.ingress.extraTls }}
  tls:
    {{- if .Values.ingress.tls }}
    - hosts:
        - {{ tpl .Values.ingress.hostname . | quote }}
      secretName: {{ default (printf "%s-tls" (include "packcove.fullname" .)) .Values.ingress.existingSecret | quote }}
    {{- end }}
    {{- with .Values.ingress.extraTls }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
