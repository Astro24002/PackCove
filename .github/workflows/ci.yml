name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Run vet
        run: go vet ./...

      - name: Validate Docker Compose configuration
        run: docker compose -f docker/compose.yaml config --quiet

      - name: Install Helm CLI
        run: |
          curl -fsSL https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz -o /tmp/helm-v4.3.1-linux-amd64.tar.gz
          echo "0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b  /tmp/helm-v4.3.1-linux-amd64.tar.gz" | sha256sum --check
          tar -xzf /tmp/helm-v4.3.1-linux-amd64.tar.gz -C /tmp linux-amd64/helm
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm

      - name: Lint and render Helm chart
        run: |
          helm lint --strict helm/packcove
          helm template packcove helm/packcove --namespace packcove > /dev/null
          helm template packcove helm/packcove --namespace packcove \
            --set ingress.enabled=true \
            --set ingress.hostname=packcove.example.internal \
            --set ingress.tls=true \
            --set ingress.existingSecret=packcove-tls > /dev/null
          helm template packcove helm/packcove --namespace packcove \
            --set persistence.existingClaim=packcove-data-existing \
            --set global.storageClass=fast > /dev/null
          helm template packcove helm/packcove --namespace packcove \
            --set global.imageRegistry=registry.example.internal \
            --set image.repository=team/packcove \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set 'image.pullSecrets[0]=ghcr-pull-secret' > /dev/null
          if helm template packcove helm/packcove --set replicaCount=2 > /dev/null 2>&1; then
            echo "expected chart to reject replicaCount=2"
            exit 1
          fi
          if helm template packcove helm/packcove --set updateStrategy.type=RollingUpdate > /dev/null 2>&1; then
            echo "expected chart to reject RollingUpdate"
            exit 1
          fi

  publish-image:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ghcr.io/astro24002/packcove
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read PackCove app version
        id: chart
        run: |
          version="$(awk -F '"' '/^appVersion:/ {print $2}' helm/packcove/Chart.yaml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.chart.outputs.version }}
            type=sha,prefix=sha-

      - name: Build and publish application image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
